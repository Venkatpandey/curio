name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    name: Validate version tag
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require a semantic version
        env:
          TAG: ${{ github.ref_name }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]'
  checks:
    needs: version
    uses: ./.github/workflows/checks.yml
  publish:
    needs: checks
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      release: true
