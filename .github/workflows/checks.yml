name: Checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  go:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal web)"
      - run: go mod verify
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go vet ./...
      - run: go build -trimpath -o bin/curio ./cmd/curio
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
  browser:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps "$CURIO_TEST_BROWSER"
        env:
          CURIO_TEST_BROWSER: ${{ matrix.browser }}
      - run: go build -o bin/curio ./cmd/curio
      - name: Test disposable app
        shell: bash
        env:
          CURIO_ACCESS_PASSWORD: curio-local-qa-password
          CURIO_DATA_DIR: ${{ runner.temp }}/curio-data
          CURIO_PORT: '18080'
          CURIO_WIKIMEDIA_ENABLED: 'false'
          CURIO_FEEDS_ENABLED: 'false'
          CURIO_TEST_BROWSER: ${{ matrix.browser }}
        run: |
          mkdir -p test-results
          bin/curio > test-results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/health
          npm run test:browser
          npm run test:lan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  container:
    name: Linux amd64 + arm64
    needs: [go, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
